name: Deploy alerts backend

# Applies D1 migrations and deploys the alert Worker when their code changes on main.
# Uses CLOUDFLARE_BACKEND_TOKEN, which only has D1:Edit and Workers Scripts:Edit, so the
# Pages deploy token never gets database or Worker access.
on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - "worker/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKEND_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - run: npm ci
      - run: npm test

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply presalewatch --remote

      - name: Deploy alert Worker
        run: npx wrangler deploy --config worker/wrangler.toml
