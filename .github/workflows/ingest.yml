name: Ingest intelligence data

# Fills the D1 intelligence database from Ticketmaster, Last.fm, MusicBrainz, Wikidata,
# venue enrichment (Wikidata, Wikipedia, OpenStreetMap), Wikipedia pageviews, ListenBrainz,
# and YouTube (current values only). Runs daily and on demand. It writes only to the
# intelligence tables in D1; the live page and its scoring still come from the existing
# pipeline. The coverage report goes into the run summary, and the venues still missing a
# capacity are attached as venues_to_fill.csv for filling in by hand.
on:
  schedule:
    - cron: "40 9 * * *"     # daily, 09:40 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources, or 'all'"
        default: all

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python -m unittest

      - name: Ingest
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_BACKEND_TOKEN }}   # D1:Edit only
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Passed through the environment, never pasted into the script; run.py rejects unknown names.
          SOURCES: ${{ github.event.inputs.sources || 'all' }}
        run: |
          set -o pipefail
          python -u -m ingest.run --db d1 --sources "$SOURCES" | tee ingest.log
          { echo '```'; sed -n '/^Coverage report/,$p' ingest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand-fill list of venues without a capacity
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_BACKEND_TOKEN }}
        run: python -m ingest.venue_handfill export --db d1 --out venues_to_fill.csv

      - name: Attach the hand-fill list
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: venues_to_fill
          path: venues_to_fill.csv
          if-no-files-found: ignore
          retention-days: 30
