<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · PouchIt</title>
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/account.css">
<script src="/assets/confirm.js" defer></script>
</head>
<body>
<header class="hero"><div class="wrap"><a class="brand" href="/">PouchIt</a></div></header>
<main class="wrap">
  <div class="card">
    <h1>Finish signing in</h1>
    <p id="status" class="muted">Checking your link…</p>
    <button type="button" id="confirm" hidden>Sign in</button>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
    <p id="retry" class="small" hidden><a href="/alerts">Request a new sign-in link</a></p>
  </div>
</main>
</body>
</html>
