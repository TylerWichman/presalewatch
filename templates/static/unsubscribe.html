<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe · PouchIt</title>
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/account.css">
<script src="/assets/unsubscribe.js" defer></script>
</head>
<body>
<header class="hero"><div class="wrap"><a class="brand" href="/">PouchIt</a></div></header>
<main class="wrap">
  <div class="card">
    <h1>Unsubscribe</h1>
    <p id="status" class="muted">Stop all PouchIt alert emails to this address?</p>
    <button type="button" id="confirm">Unsubscribe from all alerts</button>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
    <p class="small muted">You can turn alerts back on, or delete your account, from <a href="/alerts">My alerts</a>.</p>
  </div>
</main>
</body>
</html>
